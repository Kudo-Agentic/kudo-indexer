# Kudo covenants on Robinhood Chain.
#
# Shaped for kudo-client: field names follow its `CovenantDetails` and
# `Activity` types (src/lib/types/cnft.ts, src/lib/types/activity.ts) and the
# enum values are its own `Status` and `ActivityAction` strings, so the UI can
# render rows as they come. Addresses are Bytes and come back as lowercase
# hex; BigInts come back as decimal strings.

# kudo-client `Status`. Shown as Open / Ongoing / Completed / Failed.
enum CovenantStatus {
  minted
  ongoing
  completed
  failed
}

# kudo-client `ActivityAction`.
enum ActivityAction {
  minted
  promiseSettled
  askSettled
  statusChanged
  transferred
  burned
}

# One covenant NFT: one card.
#
# Ids restart at zero on each redeploy, so a covenant is keyed by contract and
# id together: "<contract lowercased>:<nftId>", the same as kudo-client's
# `covenantKey`.
type Covenant @entity(immutable: false) {
  id: ID!
  nftId: BigInt!
  contractAddress: Bytes!
  # Minted on a contract the chain has outgrown. Shown, never written to.
  isLegacy: Boolean!
  # On the client's blacklist. Indexed anyway; excluded from every count.
  hidden: Boolean!

  agent: Agent!
  agentWallet: Bytes!
  # The agent's ERC-8004 identity, read from the contract at mint.
  agentId: BigInt
  # The identity's "name" metadata at the mint block. Null where it has none:
  # the UI labels those "Agent {nftId}".
  agentName: String
  # The identity's "teeId" metadata at the mint block: what the UI shows as
  # Verified. Null where the agent recorded none.
  teeId: String

  owner: Bytes!
  nftType: String!
  ask: String!
  promise: String!
  promiseDetail: String!

  askSettlement: String!
  askSettledAt: BigInt
  # The account that met the ask: the transaction's signer, or, for an
  # ERC-4337 bundle, the smart account whose operation emitted the event
  # (kudo-client `actorOfLog`). Never the bundler.
  askSettledBy: Bytes
  askSettledTx: Bytes

  promiseSettlement: String!
  promiseSettledAt: BigInt
  promiseSettledBy: Bytes
  promiseSettledTx: Bytes

  # What the contract's status field says.
  recordedStatus: CovenantStatus!
  # What the UI shows: the same as recordedStatus. Only the evaluator sets
  # completed or failed; written proofs alone do not complete a covenant.
  status: CovenantStatus!
  # The ask is waiting to be met: no ask settlement and not resolved.
  askOpen: Boolean!

  # The NFT was burned, which happens once a covenant settles. `owner` keeps
  # its last holder.
  burned: Boolean!
  burnedAt: BigInt

  mintedAt: BigInt!
  mintedBlock: BigInt!
  mintedTx: Bytes!
  updatedAt: BigInt!

  activities: [Activity!]! @derivedFrom(field: "covenant")
}

# An agent, as the covenants it minted describe it: keyed by its wallet,
# lowercased, like kudo-client's AgentSummary. Hidden covenants are not
# counted.
type Agent @entity(immutable: false) {
  id: ID!
  wallet: Bytes!
  # From its newest covenant that carries one.
  agentId: BigInt
  name: String
  teeId: String

  total: Int!
  minted: Int!
  ongoing: Int!
  completed: Int!
  failed: Int!
  openAsks: Int!
  # completed / (completed + failed); null until one resolves.
  completionRate: BigDecimal

  firstCovenantAt: BigInt!
  lastCovenantAt: BigInt!

  covenants: [Covenant!]! @derivedFrom(field: "agent")
}

# One row of the activity feed (kudo-client `Activity`), with everything the
# row shows already on it.
type Activity @entity(immutable: true) {
  id: Bytes!
  # Sort key: block number * 1e6 + log index. Order by this for a feed that
  # stays in chain order within a block.
  order: BigInt!

  action: ActivityAction!
  covenant: Covenant!
  nftId: BigInt!
  contractAddress: Bytes!
  isLegacy: Boolean!
  hidden: Boolean!

  # Who acted: the transaction's signer or, for an ERC-4337 bundle, the smart
  # account behind this log. For a transfer or burn, the account it left.
  # Null when a bundle leaves it unattributable.
  actor: Bytes
  # The actor's agent name, where the actor is an agent that has minted here.
  actorName: String

  agentWallet: Bytes!
  agentName: String
  agentId: BigInt
  nftType: String!

  # statusChanged: the status it moved to (as the contract numbers it).
  status: CovenantStatus
  # minted: the promise. askSettled: the promise detail written with it.
  detail: String
  # askSettled / promiseSettled: the proof, a transaction hash or a URL.
  proof: String
  # transferred / burned: who it went to.
  counterparty: Bytes

  txHash: Bytes!
  txFrom: Bytes!
  blockNumber: BigInt!
  logIndex: BigInt!
  # Unix seconds.
  timestamp: BigInt!
}

# Who holds each covenant NFT. Kept apart from Covenant because the mint's
# Transfer is emitted before CovenantMinted, when there is no covenant yet.
type Ownership @entity(immutable: false) {
  id: ID!
  owner: Bytes!
}

# Chain-wide totals for the metrics row. A single row, id "global".
type Stats @entity(immutable: false) {
  id: ID!
  covenants: Int!
  agents: Int!
  minted: Int!
  ongoing: Int!
  completed: Int!
  failed: Int!
  openAsks: Int!
}
