# Compiles the subgraph on every push to main and on pull requests, so a
# mapping that doesn't build never reaches a deploy.
name: Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Generate types
        run: pnpm codegen

      - name: Build subgraph
        run: pnpm build

      - name: Typecheck client
        run: pnpm typecheck:client
